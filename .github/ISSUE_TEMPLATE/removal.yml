name: Remove my comment
description: Ask for a Hacker News comment you wrote to be taken off hackercourses.com.
title: "Removal request"
labels: ["removal"]
body:
  - type: markdown
    attributes:
      value: |
        If you wrote a comment quoted on Hacker Courses and want it taken down, tell us which one.
        It's removed on the next deploy and stays removed in future data refreshes.

        This issue is public. If you'd rather not ask in public, say so and leave only the HN username
        you want removed, or ask for everything by your username.
  - type: input
    id: comment
    attributes:
      label: Link to the comment
      description: The Hacker News link (news.ycombinator.com/item?id=...) or the "Open comment" link from the course page.
      placeholder: https://news.ycombinator.com/item?id=12345678
    validations:
      required: false
  - type: input
    id: username
    attributes:
      label: Or remove everything by this HN username
      placeholder: your-hn-username
    validations:
      required: false
  - type: checkboxes
    id: author
    attributes:
      label: Confirmation
      options:
        - label: I wrote the comment(s), or I'm acting for the person who did.
          required: true
