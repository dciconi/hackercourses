[project]
name = "hacker-courses"
version = "0.1.0"
description = "The online courses programmers keep recommending, ranked from Hacker News comments."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "resvg-py>=0.5.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
